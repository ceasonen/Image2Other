name: Test and deploy studio
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: python3 -m unittest discover -s tests -p test_paddle_service.py
      - run: npm run build
      - name: Verify conversions in a real browser
        shell: bash
        run: |
          npm run preview > "$RUNNER_TEMP/image2other-preview.log" 2>&1 &
          studio_preview_pid=$!
          studio_chrome_profile=$(mktemp -d "$RUNNER_TEMP/image2other-chrome.XXXXXX")
          google-chrome --headless --no-sandbox --disable-gpu --remote-debugging-port=9226 --user-data-dir="$studio_chrome_profile" about:blank > "$RUNNER_TEMP/image2other-chrome.log" 2>&1 &
          studio_chrome_pid=$!
          trap 'kill "$studio_preview_pid" "$studio_chrome_pid" 2>/dev/null || true' EXIT
          for studio_attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4178/Image2Other/ > /dev/null && curl -fsS http://127.0.0.1:9226/json > /dev/null; then
              break
            fi
            sleep 1
          done
          node tests/browser.mjs http://127.0.0.1:4178/Image2Other/ 9226
          node tests/ocr-browser.mjs http://127.0.0.1:4178/Image2Other/ 9226
          node tests/ocr-browser.mjs http://127.0.0.1:4178/Image2Other/ 9226 eng+chi_sim
          node tests/paddle-browser.mjs http://127.0.0.1:4178/Image2Other/ 9226
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
